<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Profile Photo | Portfolio Suite</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #0b0f19;
            --bg-card: rgba(17, 24, 39, 0.7);
            --border-glow: rgba(99, 102, 241, 0.3);
            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
            --accent: #6366f1;
            --accent-glow: rgba(99, 102, 241, 0.4);
            --success: #10b981;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-deep);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(168, 85, 247, 0.15) 0px, transparent 50%);
        }

        .upload-container {
            background: var(--bg-card);
            border: 1px solid var(--border-glow);
            border-radius: 20px;
            padding: 3rem 2rem;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 20px rgba(99, 102, 241, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            text-align: center;
            box-sizing: border-box;
        }

        h1 {
            font-family: 'Outfit', sans-serif;
            font-weight: 700;
            font-size: 2rem;
            margin-top: 0;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #fff 30%, #a5b4fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            color: var(--text-secondary);
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 2rem;
        }

        .upload-zone {
            border: 2px dashed rgba(99, 102, 241, 0.4);
            border-radius: 12px;
            padding: 2rem;
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(99, 102, 241, 0.02);
            margin-bottom: 1.5rem;
            position: relative;
        }

        .upload-zone:hover {
            border-color: var(--accent);
            background: rgba(99, 102, 241, 0.05);
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.1);
        }

        .upload-icon {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            display: inline-block;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        .upload-text {
            font-weight: 500;
            color: var(--text-primary);
        }

        .upload-hint {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-top: 0.5rem;
        }

        #file-input {
            display: none;
        }

        .preview-container {
            display: none;
            flex-direction: column;
            align-items: center;
            margin-top: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .profile-img-preview {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid var(--accent);
            box-shadow: 0 0 20px var(--accent-glow);
            margin-bottom: 1rem;
        }

        .status-badge {
            background: rgba(16, 185, 129, 0.15);
            color: var(--success);
            padding: 0.5rem 1rem;
            border-radius: 30px;
            font-size: 0.85rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            border: 1px solid rgba(16, 185, 129, 0.2);
            margin-bottom: 1.5rem;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .btn {
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 10px;
            padding: 0.85rem 1.5rem;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            box-shadow: 0 4px 12px var(--accent-glow);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(99, 102, 241, 0.6);
            background: #5053e6;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
            box-shadow: none;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
            box-shadow: none;
        }
    </style>
</head>
<body>

    <div class="upload-container">
        <h1>Add Portfolio Photo</h1>
        <p>Upload your professional headshot image below. It will be automatically optimized and instantly linked to your local portfolio website.</p>

        <div class="upload-zone" onclick="document.getElementById('file-input').click()">
            <span class="upload-icon">📷</span>
            <div class="upload-text">Click to choose your photo</div>
            <div class="upload-hint">Supports PNG, JPG, or JPEG</div>
        </div>

        <input type="file" id="file-input" accept="image/*">

        <div class="preview-container" id="preview-container">
            <img class="profile-img-preview" id="profile-preview" src="" alt="Profile Preview">
            <div class="status-badge">
                <span style="font-size: 1.1rem;">✓</span> Photo synced to Portfolio!
            </div>
        </div>

        <div class="btn-group">
            <a href="index.html" class="btn" id="open-btn">🚀 Open Portfolio Page</a>
            <button class="btn btn-secondary" id="download-btn" style="display: none;">💾 Download Optimized Photo (as profile.png)</button>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('file-input');
        const previewContainer = document.getElementById('preview-container');
        const profilePreview = document.getElementById('profile-preview');
        const downloadBtn = document.getElementById('download-btn');
        let optimizedImageBlob = null;

        // Auto load existing photo from localStorage on load if present
        window.onload = function() {
            const saved = localStorage.getItem('portfolio_profile_photo');
            if (saved) {
                profilePreview.src = saved;
                previewContainer.style.display = 'flex';
            }
        };

        fileInput.onchange = function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(evt) {
                const img = new Image();
                img.onload = function() {
                    // Set square crop dimensions & bounds (max 500px for sharp high-res presentation)
                    const maxDim = 500;
                    let width = img.width;
                    let height = img.height;
                    
                    // Determine crop properties for square profile
                    const size = Math.min(width, height);
                    const sourceX = (width - size) / 2;
                    const sourceY = (height - size) / 2;

                    const canvas = document.createElement('canvas');
                    canvas.width = maxDim;
                    canvas.height = maxDim;
                    const ctx = canvas.getContext('2d');
                    
                    // Draw nice circular center-cropped square
                    ctx.drawImage(img, sourceX, sourceY, size, size, 0, 0, maxDim, maxDim);
                    
                    const dataURL = canvas.toDataURL('image/png');
                    
                    // Save base64 string to localStorage (shared namespace for portfolio)
                    localStorage.setItem('portfolio_profile_photo', dataURL);
                    
                    // Update preview UI
                    profilePreview.src = dataURL;
                    previewContainer.style.display = 'flex';
                    downloadBtn.style.display = 'inline-flex';

                    // Convert to blob for easy direct download
                    canvas.toBlob(function(blob) {
                        optimizedImageBlob = blob;
                    }, 'image/png');
                };
                img.src = evt.target.result;
            };
            reader.readAsDataURL(file);
        };

        // Handle downloading resized image
        downloadBtn.onclick = function() {
            if (!optimizedImageBlob) return;
            const url = URL.createObjectURL(optimizedImageBlob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'profile.png';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        };
    </script>
</body>
</html>
